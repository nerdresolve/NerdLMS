# =============================================================================
# NerdResolve EAD — ambiente completo
#
# Decisões de segurança, cada uma vinda de um item do AGENTS.md:
#
# - PostgreSQL e MinIO **não publicam porta**. Só o proxy fala com a internet.
#   Banco acessível de fora é o erro mais caro e mais comum (§26).
# - Duas redes: `edge` (proxy ↔ app) e `internal` (app ↔ banco/storage). O
#   banco não alcança a internet nem é alcançado por ela.
# - Containers rodam como usuário não-root, com filesystem somente-leitura onde
#   dá, e sem capacidades extras (§27).
# - Nenhum segredo no arquivo: tudo vem de `.env`, que não é versionado (§13).
#
# Este arquivo vive em `infra/` junto do `.env`, e é de lá que o compose lê as
# variáveis. Da raiz do repositório, use os atalhos:
#
#   npm run up        # sobe tudo
#   npm run migrate   # aplica as migrações
#   npm run down
# =============================================================================

name: nerdlms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Sem `ports:` de propósito. Para inspecionar em desenvolvimento:
    #   docker compose exec db psql -U postgres nerdlms
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      # Checksum de página: detecta corrupção silenciosa em disco. Só pode ser
      # ligado na criação do cluster — depois exige recriar.
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=pt_BR.UTF-8 --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  storage:
    # Vídeos e materiais. Compatível com S3: trocar por S3 real depois é mudar
    # variável de ambiente, não código — e é o oposto de lock-in.
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?defina no .env}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?defina no .env}
    volumes:
      - storage-data:/data
    networks:
      # `edge` além de `internal` porque o navegador precisa alcançar o objeto,
      # e quem o alcança é o proxy — que só vive na borda. O banco continua
      # apenas em `internal`: o proxy nunca chega até ele.
      #
      # A porta 9000 NÃO é publicada: o acesso passa pelo proxy, em
      # `/media-storage/*`, e o console de administração (9001) fica fora.
      - internal
      - edge
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  storage-init:
    # Cria o bucket na primeira subida. O MinIO sobe com o disco vazio, e sem
    # isto todo upload responde 404 — o bucket precisaria ser criado à mão em
    # cada ambiente, que é justamente o tipo de passo que se esquece.
    # Roda, cria e sai; `mc mb --ignore-existing` torna a repetição inofensiva.
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set nerdlms http://storage:9000 $${STORAGE_ACCESS_KEY} $${STORAGE_SECRET_KEY} &&
      mc mb --ignore-existing nerdlms/$${STORAGE_BUCKET} &&
      echo 'bucket pronto'
      "
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?defina no .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?defina no .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lms-media}
    networks:
      - internal
    restart: "no"
    security_opt:
      - no-new-privileges:true

  migrate:
    # Roda uma vez e sai. Usa o papel dono do schema, que a aplicação não tem.
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # As três são usadas pelo script abaixo. Faltavam POSTGRES_USER e
      # POSTGRES_DB: sem elas o psql caía no usuário padrão do container e
      # falhava com "password authentication failed for user root".
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # Senha do papel da aplicação, criada pela migração 002.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina no .env}
    volumes:
      - ./db/migrations:/migrations:ro
      # Os seeds ficam fora de `migrations/` de propósito: `npm run migrate`
      # aplica tudo que houver lá, e dado de homologação não é schema.
      - ./db/seeds:/seeds:ro
    networks:
      - internal
    entrypoint: ["/bin/sh", "-c"]
    command: >
      'set -e;
       for file in /migrations/*.sql; do
         echo "→ $$file";
         psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
              --single-transaction -v ON_ERROR_STOP=1 \
              -v app_password="$$APP_DB_PASSWORD" -f "$$file";
       done;
       echo "Migrações aplicadas."'

  app:
    build:
      # O Dockerfile continua junto do app que ele constrói; só o CONTEXTO é a
      # raiz, porque o `package-lock.json` do workspace mora lá (e só lá).
      context: ..
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # A aplicação usa `lms_app`, sem DDL — não o dono do schema.
      DATABASE_URL: ${DATABASE_URL:?defina no .env}
      # Fuso da operação, não UTC.
      #
      # O contêiner nasce em UTC, três horas à frente de Sergipe. Consequência
      # concreta: entre 21h e meia-noite no horário local, `new Date()` dentro
      # do processo já está no dia seguinte — o calendário marcaria amanhã como
      # hoje, e um prazo que vence hoje sairia da lista de próximos antes da
      # hora. Quem demonstrasse a plataforma à noite veria isso.
      TZ: ${TZ:-America/Sao_Paulo}
      SESSION_SECRET: ${SESSION_SECRET:?defina no .env}
      # Sem provedor de e-mail contratado, `log` grava a mensagem no log em vez
      # de enviar. Ver a nota em `.env.example`.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-log}
      # Só usadas com MAIL_TRANSPORT=smtp. Sem valor padrão de propósito: um
      # host inventado aqui faria o envio falhar em runtime, longe da causa.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      STORAGE_ENDPOINT: http://storage:9000
      # Onde o NAVEGADOR alcança o storage. O proxy publica `/lms-media/*` no
      # mesmo domínio do site, e a URL assinada é emitida contra este endereço.
      #
      # NORMALMENTE VAZIO, e é assim que deve ficar. A aplicação assina contra
      # a origem da requisição que está atendendo, que acerta sozinha em
      # qualquer ambiente. Esta variável só entra quando não há requisição.
      #
      # O padrão anterior era `https://localhost:8444`, uma porta que nenhum
      # serviço publica. Como a assinatura do S3 cobre o host, toda URL saía
      # apontando para um endereço morto e NENHUM vídeo carregava — nem aqui
      # nem na instalação publicada, que atende em outro domínio e caía no
      # mesmo padrão. Sem erro na tela: o `<video>` simplesmente não tocava.
      #
      # Se precisar preencher, use o endereço que o navegador usa, com esquema
      # e porta: `https://ead.exemplo.com.br` ou `http://localhost:8080`.
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lms-media}
    networks:
      - internal
      - edge
    read_only: true
    tmpfs:
      # Next precisa escrever cache em runtime; o resto do filesystem fica
      # somente-leitura.
      #
      # O caminho tem `apps/frontend` porque o standalone de um workspace
      # preserva a estrutura do repositório (DEC-063). Apontar para
      # `/app/.next/cache` cria um diretório que ninguém usa, e a otimização de
      # imagem falha com ENOENT a cada requisição.
      - /tmp
      - /app/apps/frontend/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # O Caddyfile lê as duas como `{$VAR:padrão}`. Sem repassá-las aqui, o
      # container não as enxerga e cai no padrão silenciosamente: o site sobe em
      # `localhost` com certificado interno, e o domínio configurado no `.env`
      # não tem efeito nenhum — sem erro, sem aviso.
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      # Servem ao acesso local (`https://localhost`). O túnel NÃO passa por
      # aqui: ele alcança o proxy pela rede `edge`, de dentro do Docker. Numa
      # máquina exposta à internet, estas duas linhas podem sair sem afetar a
      # publicação pelo túnel.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  tunnel:
    # Cloudflare Tunnel: a saída é do container PARA a Cloudflare, então a
    # máquina não precisa de IP público, nem de porta aberta na entrada, nem de
    # certificado próprio — o TLS público termina na borda da Cloudflare.
    #
    # Fica sob perfil: `npm run up` local não sobe túnel nenhum, e publicar é um
    # comando explícito (`npm run publish`), nunca efeito colateral.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - proxy
    command: tunnel --no-autoupdate run
    environment:
      # Credencial do túnel: dá controle sobre ele, ao contrário dos IDs de
      # zona e conta, que só identificam. Por isso vive no `.env.tunnel`, fora
      # do Git, e não neste arquivo nem no `.env` versionado.
      #
      # Sem `:?` de propósito: o Compose interpola TODOS os serviços antes de
      # filtrar por perfil, então exigir o valor aqui quebraria `npm run up`
      # numa máquina que nunca vai publicar. Faltando o token, quem reclama é o
      # próprio cloudflared, e só quando o perfil `tunnel` sobe.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # Só o proxy toca as duas pontas.
  edge:
  internal:
    internal: true

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
