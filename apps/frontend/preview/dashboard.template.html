<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard · NerdResolve</title>

/* ===== Barra de Visual QA (fora do produto) ===== */
.qa {
  position: fixed; z-index: 70; bottom: var(--space-4); left: 50%; translate: -50% 0;
  display: flex; align-items: center; gap: var(--space-1);
  padding: var(--space-1);
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
}
.qa__label { font-size: 10px; letter-spacing: var(--tracking-wide); text-transform: uppercase; color: var(--text-faint); padding: 0 var(--space-2); }
.qa button {
  min-height: 32px; padding: 0 var(--space-3);
  font: inherit; font-size: var(--text-caption-size); font-weight: var(--weight-medium);
  color: var(--text-muted);
  background: none; border: 0; border-radius: var(--radius-full); cursor: pointer;
}
.qa button[aria-pressed="true"] { background: var(--brand); color: var(--text-on-brand); }
.qa__sep { width: 1px; height: 20px; background: var(--border-subtle); margin-inline: var(--space-1); }
body[data-device="mobile"] .app { max-width: 390px; margin-inline: auto; border-inline: 1px solid var(--border-subtle); }
body[data-state="empty"] .state-data,
body[data-state="loading"] .state-data { display: none; }
body[data-state="data"] .state-empty,
body[data-state="loading"] .state-empty { display: none; }
body[data-state="data"] .state-loading,
body[data-state="empty"] .state-loading { display: none; }
</style>
</head>
<body data-device="desktop" data-state="data">

<div class="qa" role="group" aria-label="Controles de validação visual">
  <span class="qa__label">QA</span>
  <button type="button" id="qa-device" aria-pressed="false">Mobile</button>
  <span class="qa__sep"></span>
  <button type="button" id="qa-reset">Reiniciar demo</button>
  <span class="qa__sep"></span>
  <button type="button" class="qa-state" data-state="data" aria-pressed="true">Dados</button>
  <button type="button" class="qa-state" data-state="loading" aria-pressed="false">Carregando</button>
  <button type="button" class="qa-state" data-state="empty" aria-pressed="false">Vazio</button>
</div>

<!-- Sprite Lucide gerado a partir de public/brand/icons (pacote oficial) -->
@@ICON_SPRITE@@

<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>

<div class="app">
<div class="shell" id="shell" data-sidebar="expanded">

  <!-- ============ Sidebar (desktop) ============ -->
  <aside class="sidebar">
    <div class="sidebar__head">
      <img class="sidebar__logo" src="@@LOGO@@" alt="NerdResolve" width="1249" height="354" />
      <img class="sidebar__mark" src="@@MARK@@" alt="NerdResolve" width="474" height="258" />
      <button type="button" class="sidebar__toggle" id="sidebar-toggle" aria-expanded="true" aria-label="Recolher menu">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-panel-left"/></svg>
      </button>
    </div>

    <nav class="sidebar__nav" aria-label="Navegação principal">
      @@NAV@@
    </nav>

    <div class="sidebar__foot">
      <span class="avatar" aria-hidden="true">@@INITIALS@@</span>
      <span class="sidebar__user-text">
        <span class="sidebar__user-name">@@FULLNAME@@</span><br />
        <a class="sidebar__user-link" href="/perfil">Ver perfil</a>
      </span>
    </div>
  </aside>

  <!-- ============ Área principal ============ -->
  <div>
    <header class="topbar">
      <button type="button" class="icon-button topbar__menu" id="drawer-open" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg>
      </button>
      <img class="topbar__logo" src="@@LOGO_BRAND@@" alt="NerdResolve" width="1249" height="354" />
      <span class="topbar__spacer"></span>
      <div class="search topbar__search">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg>
        <label class="sr-only" for="busca-topo">Buscar cursos</label>
        <input class="input" id="busca-topo" type="search" placeholder="Buscar cursos" autocomplete="off" />
      </div>
      <button type="button" class="icon-button topbar__search-icon" aria-label="Buscar"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"/></svg></button>
      <button type="button" class="icon-button" id="theme-toggle" aria-pressed="false" aria-label="Ativar modo escuro"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-moon"/></svg></button>
      <button type="button" class="icon-button topbar__notifications" aria-label="Notificações"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bell"/></svg></button>
      <button type="button" class="icon-button icon-button--avatar" aria-label="Sua conta">@@INITIALS@@</button>
    </header>

    <main class="content" id="conteudo">
      <div class="page-head">
        <h1 class="page-head__greeting">@@GREETING@@</h1>
        <p class="page-head__sub">@@SUBTITLE@@</p>
      </div>

      <section class="spotlight" aria-label="Sua jornada">
        @@CONTINUE@@
        @@SUMMARY@@
      </section>

      <section aria-labelledby="meus-cursos">
        <div class="section-head">
          <h2 class="section-head__title" id="meus-cursos">Meus cursos</h2>
          <a class="link" href="/cursos">Ver todos</a>
        </div>

        <div class="course-grid state-data">
          @@COURSES@@
        </div>

        <div class="course-grid state-loading" aria-hidden="true">
          @@SKELETONS@@
        </div>

        @@EMPTY@@
      </section>
    </main>
  </div>
</div>

<!-- ============ Drawer (mobile) ============ -->
</div>

<div class="drawer-backdrop" id="drawer-backdrop" data-open="false"></div>
<div class="drawer" id="drawer" data-open="false" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="sidebar__head">
    <img class="sidebar__logo" src="@@LOGO@@" alt="NerdResolve" width="1249" height="354" />
    <button type="button" class="sidebar__toggle" id="drawer-close" aria-label="Fechar menu">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-x"/></svg>
    </button>
  </div>
  <nav class="sidebar__nav" aria-label="Navegação principal">
    @@NAV@@
  </nav>
  <div class="sidebar__foot">
    <span class="avatar" aria-hidden="true">@@INITIALS@@</span>
    <span class="sidebar__user-text">
      <span class="sidebar__user-name">@@FULLNAME@@</span><br />
      <a class="sidebar__user-link" href="/perfil">Ver perfil</a>
    </span>
  </div>
</div>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var body = document.body;

  /* --- Barra de QA --- */
  var deviceBtn = document.getElementById("qa-device");
  deviceBtn.addEventListener("click", function () {
    var mobile = body.getAttribute("data-device") === "mobile";
    body.setAttribute("data-device", mobile ? "desktop" : "mobile");
    deviceBtn.setAttribute("aria-pressed", String(!mobile));
    deviceBtn.textContent = mobile ? "Mobile" : "Desktop";
  });

  Array.prototype.forEach.call(document.querySelectorAll(".qa-state"), function (button) {
    button.addEventListener("click", function () {
      body.setAttribute("data-state", button.getAttribute("data-state"));
      Array.prototype.forEach.call(document.querySelectorAll(".qa-state"), function (other) {
        other.setAttribute("aria-pressed", String(other === button));
      });
    });
  });

  /* --- Sidebar recolhível --- */

  /* --- Alternador de tema (produto, não QA) --- */
  var themeToggle = document.getElementById("theme-toggle");
  if (themeToggle) {
    themeToggle.addEventListener("click", function () {
      var dark = root.getAttribute("data-theme") === "dark";
      root.setAttribute("data-theme", dark ? "light" : "dark");
      themeToggle.setAttribute("aria-pressed", String(!dark));
      themeToggle.setAttribute("aria-label", dark ? "Ativar modo escuro" : "Ativar modo claro");
      themeToggle.querySelector("use").setAttribute("href", dark ? "#i-moon" : "#i-sun");
    });
  }

  var shell = document.getElementById("shell");
  var toggle = document.getElementById("sidebar-toggle");
  toggle.addEventListener("click", function () {
    var collapsed = shell.getAttribute("data-sidebar") === "collapsed";
    shell.setAttribute("data-sidebar", collapsed ? "expanded" : "collapsed");
    toggle.setAttribute("aria-expanded", String(collapsed));
    toggle.setAttribute("aria-label", collapsed ? "Recolher menu" : "Expandir menu");
  });

  /* --- Drawer com foco preso e Esc --- */
  var drawer = document.getElementById("drawer");
  var backdrop = document.getElementById("drawer-backdrop");
  var openBtn = document.getElementById("drawer-open");
  var closeBtn = document.getElementById("drawer-close");

  function openDrawer() {
    drawer.hidden = false;
    // deixa o navegador aplicar `hidden: false` antes de animar
    window.requestAnimationFrame(function () {
      drawer.setAttribute("data-open", "true");
      backdrop.setAttribute("data-open", "true");
    });
    openBtn.setAttribute("aria-expanded", "true");
    closeBtn.focus();
    document.addEventListener("keydown", onKeydown);
  }

  function closeDrawer() {
    drawer.setAttribute("data-open", "false");
    backdrop.setAttribute("data-open", "false");
    openBtn.setAttribute("aria-expanded", "false");
    openBtn.focus();
    document.removeEventListener("keydown", onKeydown);
    window.setTimeout(function () { drawer.hidden = true; }, 220);
  }

  function onKeydown(event) {
    if (event.key === "Escape") { closeDrawer(); return; }
    if (event.key !== "Tab") return;
    var focusable = drawer.querySelectorAll('a[href], button:not([disabled])');
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }

  openBtn.addEventListener("click", openDrawer);
  closeBtn.addEventListener("click", closeDrawer);
  backdrop.addEventListener("click", closeDrawer);
})();
</script>
@@RUNTIME@@
</body>
</html>
