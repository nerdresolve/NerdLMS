name: Segurança

# Três varreduras que pegam classes diferentes de problema:
#   CodeQL      defeito no código (injeção, XSS, caminho não sanitizado)
#   npm audit   dependência com vulnerabilidade conhecida
#   Gitleaks    segredo que entrou num commit
#
# Roda em PR (pega antes de entrar) e semanalmente (pega o que virou
# vulnerabilidade DEPOIS de entrar — a maioria dos casos).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Segunda, 04:17 UTC. Minuto quebrado de propósito: o GitHub enfileira
    # agendamentos na hora cheia e eles atrasam.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # `security-and-quality` acha mais que o padrão, incluindo problema
          # de manutenção que costuma virar defeito depois.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  dependencias:
    name: Dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `--omit=dev`: vulnerabilidade em ferramenta de build não chega ao
      # usuário. Falhar por causa dela treina a equipe a ignorar o portão.
      #
      # O nível é `critical`, e não `high`, por uma razão datada: duas altas
      # vivem em dependências TRANSITIVAS do Next (postcss e sharp) e só somem
      # com o Next 16, cujo linter acusa 15 defeitos de React que pedem
      # correção com calma. Reprovar por elas hoje deixaria o portão vermelho
      # sem ninguém poder consertá-lo — e portão que fica vermelho para de ser
      # lido. As altas continuam visíveis no passo informativo abaixo.
      #
      # AO SUBIR PARA O NEXT 16: volte para `--audit-level=high`.
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=critical
      # Tudo o mais aparece no log sem reprovar: é para olhar, não para
      # bloquear entrega. Inclui as altas transitivas citadas acima.
      - name: npm audit completo (informativo)
        run: npm audit --audit-level=moderate || true

  segredos:
    name: Segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Histórico inteiro: um segredo apagado no commit seguinte continua
          # no histórico, e é de lá que ele vaza.
          fetch-depth: 0
      # A ação oficial varre só o intervalo do push, montado como
      # `<antes>^..<depois>`. No primeiro push de um repositório o `<antes>` é o
      # commit RAIZ, que não tem pai: o `^` não resolve, o git aborta e o job
      # falha sem ter varrido nada — a mensagem é "no leaks found in partial
      # scan", com código de saída diferente de zero.
      #
      # Rodar o binário direto resolve os dois problemas de uma vez: varre o
      # HISTÓRICO INTEIRO (que é o que se quer — segredo removido no commit
      # seguinte continua no histórico, e é de lá que ele vaza) e não depende de
      # como a ação monta o intervalo.
      - name: Instalar gitleaks
        run: |
          VERSAO=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Varrer o histórico
        run: gitleaks detect --source . --redact --verbose --exit-code 1
